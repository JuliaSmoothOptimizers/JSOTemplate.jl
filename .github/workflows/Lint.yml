name: Lint

on:
  push:
    branches:
      - main
    tags: ["*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  lint:
    uses: JuliaSmoothOptimizers/.github/.github/workflows/Lint.yml@move-scripts-to-github-JSO
